server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: ai-town-backend
  datasource:
    url: jdbc:mysql://172.23.206.152:3306/aitown?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: Abc@123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 172.23.206.152
      port: 6379
      timeout: 3000ms
      password: Abc@123456
      database: 0
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# 模拟世界配置
aitown:
  tick-interval-ms: 5000
  minutes-per-tick: 10
  start-hour: 8
  start-minute: 0

# OpenAI 兼容大模型
llm:
  enabled: true
  base-url: https://api.openai.com/v1
  api-key: ${LLM_API_KEY:}
  model: gpt-4o-mini
  timeout-ms: 15000
  temperature: 0.7
  max-tokens: 800
  perception-radius: 3

# Generative Agents 双层记忆
memory:
  enabled: true
  # 短期工作记忆条数（Redis）
  working-memory-size: 10
  # 长期记忆检索 Top-K
  retrieve-top-k: 5
  # 检索候选池（从库中先取最近 N 条再打分）
  retrieve-candidate-limit: 80
  # 反思触发：自上次反思以来累计重要性阈值
  reflection-importance-threshold: 30
  # 检索权重：时间衰减 / 重要性 / 关键词相关性
  weight-recency: 1.0
  weight-importance: 1.0
  weight-relevance: 1.0
  # 时间衰减系数 λ（越大则旧记忆衰减越快）；基于游戏内小时
  recency-decay-lambda: 0.995

logging:
  level:
    com.aitown: INFO
    com.baomidou.mybatisplus: WARN
