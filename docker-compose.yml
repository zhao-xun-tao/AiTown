services:
  mysql:
    image: mysql:8.0
    container_name: aitown-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aitown
      MYSQL_USER: aitown
      MYSQL_PASSWORD: aitown
    ports:
      - "3306:3306"
    volumes:
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - aitown-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aitown-redis
    ports:
      - "6379:6379"
    volumes:
      - aitown-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  aitown-mysql-data:
  aitown-redis-data:
